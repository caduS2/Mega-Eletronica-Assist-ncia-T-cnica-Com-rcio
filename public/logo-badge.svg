<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fundo Azul Petróleo Oficial -->
  <rect width="500" height="500" fill="#0a6587"/>

  <!-- Símbolo Monograma ME em Circuito Eletrônico -->
  <g transform="translate(70, 75)">
    <!-- Contorno externo e barra superior do E -->
    <path d="M 28 200 V 28 H 74 L 136 112 L 198 28 H 332 V 72 H 274" stroke="#ffffff" stroke-width="12.5" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <circle cx="266" cy="72" r="10" fill="#ffffff"/>

    <!-- Perna esquerda M trilha interna -->
    <path d="M 50 48 V 166" stroke="#ffffff" stroke-width="11" stroke-linecap="square" fill="none"/>
    <circle cx="50" cy="176" r="10" fill="#ffffff"/>

    <!-- Trilha interna M ascendente e 45 graus -->
    <path d="M 72 186 V 98 L 122 166" stroke="#ffffff" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <circle cx="72" cy="196" r="10" fill="#ffffff"/>

    <!-- Chevron interno do M -->
    <path d="M 94 66 L 136 128 L 180 66" stroke="#ffffff" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <circle cx="94" cy="66" r="9" fill="#ffffff"/>

    <!-- Descida central no vale do M -->
    <path d="M 136 140 V 196" stroke="#ffffff" stroke-width="11" stroke-linecap="square" fill="none"/>
    <circle cx="136" cy="204" r="10" fill="#ffffff"/>

    <!-- Trilha direita do M -->
    <path d="M 160 168 L 198 112 V 196" stroke="#ffffff" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <circle cx="198" cy="204" r="10" fill="#ffffff"/>

    <!-- Trilha vertical na perna direita do M -->
    <path d="M 176 74 V 146" stroke="#ffffff" stroke-width="11" stroke-linecap="square" fill="none"/>
    <circle cx="176" cy="154" r="9" fill="#ffffff"/>

    <!-- Barra central do E -->
    <path d="M 224 96 H 304" stroke="#ffffff" stroke-width="12" stroke-linecap="square" fill="none"/>
    <circle cx="312" cy="96" r="10" fill="#ffffff"/>

    <!-- Trilha secundária do E com quebra -->
    <path d="M 224 132 H 262 V 158 H 320" stroke="#ffffff" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <circle cx="328" cy="158" r="10" fill="#ffffff"/>

    <!-- Barra inferior do E e base do M -->
    <path d="M 28 200 H 100 M 172 200 H 332 V 168 H 274" stroke="#ffffff" stroke-width="12.5" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>

    <!-- Trilha inferior interna do E -->
    <path d="M 240 182 H 304" stroke="#ffffff" stroke-width="10" stroke-linecap="square" fill="none"/>
    <circle cx="232" cy="182" r="9" fill="#ffffff"/>

    <!-- Nó superior do E -->
    <circle cx="332" cy="36" r="9" fill="#ffffff"/>
  </g>

  <!-- Tipografia MEGA -->
  <text x="250" y="380" text-anchor="middle" fill="#ffffff" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Arial Black', sans-serif" font-weight="900" font-size="76" letter-spacing="4">MEGA</text>

  <!-- Tipografia ELETRÔNICA -->
  <text x="250" y="434" text-anchor="middle" fill="#ffffff" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="29" letter-spacing="15">ELETRÔNICA</text>
</svg>
